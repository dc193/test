# LLM配置 - 支持多种Provider
# 使用环境变量设置API Key: OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY

default_provider: gemini

providers:
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4

  claude:
    model: claude-3-opus-20240229

  gemini:
    model: gemini-1.5-pro

  # 本地模型（如Ollama）
  local:
    base_url: http://localhost:11434/v1
    model: llama2
