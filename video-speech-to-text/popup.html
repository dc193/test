<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频语音转文字</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>视频语音转文字</h1>
    <p class="subtitle">捕获标签页音频转文字</p>

    <div class="language-select">
      <label for="language">识别语言：</label>
      <select id="language">
        <option value="zh-CN">中文（简体）</option>
        <option value="zh-TW">中文（繁体）</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
      </select>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary">开始录制</button>
      <button id="stopBtn" class="btn btn-danger" disabled>停止录制</button>
    </div>

    <div class="status">
      <span id="statusText">点击开始后选择要捕获的标签页</span>
      <span id="timer" class="timer">00:00</span>
    </div>

    <div class="transcript-container">
      <label>转录文本：</label>
      <textarea id="transcript" readonly placeholder="转录的文字将显示在这里..."></textarea>
    </div>

    <div class="actions">
      <button id="copyBtn" class="btn btn-secondary" disabled>复制</button>
      <button id="saveBtn" class="btn btn-secondary" disabled>保存</button>
      <button id="clearBtn" class="btn btn-secondary">清空</button>
    </div>

    <div class="note">
      <small>提示：开始后会弹出选择窗口，请选择标签页并勾选"分享音频"</small>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
