<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Whisper Sandbox</title>
</head>
<body>
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // Configure transformers.js
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    let transcriber = null;

    // Initialize Whisper model
    async function initWhisper(onProgress) {
      if (transcriber) return transcriber;

      console.log('[Sandbox] Loading Whisper model...');

      transcriber = await pipeline(
        'automatic-speech-recognition',
        'Xenova/whisper-small',
        {
          progress_callback: onProgress
        }
      );

      console.log('[Sandbox] Whisper model loaded!');
      return transcriber;
    }

    // Transcribe audio data
    async function transcribeAudio(audioData, language) {
      if (!transcriber) {
        throw new Error('Whisper model not initialized');
      }

      // Map language codes
      const langMap = {
        'zh-CN': 'chinese',
        'zh-TW': 'chinese',
        'en-US': 'english',
        'en-GB': 'english',
        'ja-JP': 'japanese',
        'ko-KR': 'korean'
      };

      const whisperLang = langMap[language] || 'chinese';

      console.log('[Sandbox] Transcribing audio, length:', audioData.length);

      const result = await transcriber(audioData, {
        language: whisperLang,
        task: 'transcribe',
        chunk_length_s: 30,
        stride_length_s: 5
      });

      console.log('[Sandbox] Transcription result:', result.text);
      return result.text;
    }

    // Handle messages from parent
    window.addEventListener('message', async (event) => {
      const { id, action, data } = event.data;

      console.log('[Sandbox] Received message:', action);

      try {
        let result;

        if (action === 'initWhisper') {
          await initWhisper((progress) => {
            window.parent.postMessage({
              id,
              action: 'progress',
              data: progress
            }, '*');
          });
          result = { success: true };
        } else if (action === 'transcribe') {
          const text = await transcribeAudio(data.audioData, data.language);
          result = { success: true, text };
        } else if (action === 'ping') {
          result = { alive: true };
        }

        window.parent.postMessage({ id, action: 'response', data: result }, '*');
      } catch (error) {
        console.error('[Sandbox] Error:', error);
        window.parent.postMessage({
          id,
          action: 'error',
          data: { error: error.message }
        }, '*');
      }
    });

    // Signal ready
    console.log('[Sandbox] Ready');
    window.parent.postMessage({ action: 'ready' }, '*');
  </script>
</body>
</html>
