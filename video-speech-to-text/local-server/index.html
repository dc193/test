<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频语音转文字</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 500;
      color: #666;
      transition: all 0.2s;
    }

    .tab.active {
      color: #667eea;
      border-bottom: 2px solid #667eea;
      margin-bottom: -2px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f7f8fa;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .status.recording {
      background: #fff5f5;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .status-text {
      color: #666;
    }

    .status.recording .status-text {
      color: #e53e3e;
    }

    .timer {
      font-family: 'SF Mono', Monaco, monospace;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e0e0e0;
    }

    .upload-area {
      border: 2px dashed #e0e0e0;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f7f8fa;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #eef2ff;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-text {
      color: #666;
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 12px;
      color: #999;
    }

    .file-info {
      display: none;
      padding: 12px 16px;
      background: #f0f9ff;
      border-radius: 8px;
      margin-bottom: 20px;
      align-items: center;
      gap: 12px;
    }

    .file-info.show {
      display: flex;
    }

    .file-name {
      flex: 1;
      font-weight: 500;
      color: #333;
    }

    .file-remove {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 18px;
    }

    .file-remove:hover {
      color: #e53e3e;
    }

    .note {
      margin-top: 24px;
      padding: 16px;
      background: #fffbeb;
      border-radius: 8px;
      font-size: 13px;
      color: #92400e;
    }

    .note strong {
      display: block;
      margin-bottom: 8px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>视频语音转文字</h1>
    <p class="subtitle">使用本地 Whisper Medium 模型转录（支持标点）</p>

    <div class="tabs">
      <button class="tab active" data-tab="record">屏幕录制</button>
      <button class="tab" data-tab="upload">上传文件</button>
    </div>

    <div class="section">
      <label for="language">识别语言：</label>
      <select id="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </div>

    <!-- 屏幕录制 -->
    <div id="recordTab" class="tab-content active">
      <div class="controls">
        <button id="startBtn" class="btn btn-primary">开始录制</button>
        <button id="stopBtn" class="btn btn-danger" disabled>停止录制</button>
      </div>

      <div class="status" id="status">
        <span class="status-text" id="statusText">准备就绪</span>
        <span class="timer" id="timer">00:00</span>
      </div>
    </div>

    <!-- 上传文件 -->
    <div id="uploadTab" class="tab-content">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击选择或拖放文件</div>
        <div class="upload-hint">支持 MP3, WAV, M4A, MP4, WebM 等格式</div>
      </div>
      <input type="file" id="fileInput" accept="audio/*,video/*">

      <div class="file-info" id="fileInfo">
        <span class="file-name" id="fileName"></span>
        <button class="file-remove" id="fileRemove">✕</button>
      </div>

      <button id="uploadBtn" class="btn btn-primary" style="width:100%" disabled>开始转录</button>

      <div class="status" id="uploadStatus" style="margin-top: 20px;">
        <span class="status-text" id="uploadStatusText">选择文件后点击转录</span>
      </div>
    </div>

    <div class="section">
      <label>转录文本：</label>
      <textarea id="transcript" placeholder="转录的文字将显示在这里..."></textarea>
    </div>

    <div class="actions">
      <button id="copyBtn" class="btn btn-secondary" disabled>复制文本</button>
      <button id="saveBtn" class="btn btn-secondary" disabled>保存文件</button>
      <button id="clearBtn" class="btn btn-secondary">清空</button>
    </div>

    <div class="note">
      <strong>使用说明：</strong>
      <b>屏幕录制：</b>选择标签页/屏幕，勾选"共享音频"<br>
      <b>上传文件：</b>直接上传音频或视频文件转录
    </div>
  </div>

  <script>
    // 元素
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const statusDiv = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const transcript = document.getElementById('transcript');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const languageSelect = document.getElementById('language');
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileRemove = document.getElementById('fileRemove');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatusText = document.getElementById('uploadStatusText');

    let mediaRecorder = null;
    let audioChunks = [];
    let timerInterval = null;
    let startTime = null;
    let selectedFile = null;

    // 标签切换
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
      });
    });

    // ===== 屏幕录制 =====
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length === 0) {
          alert('请确保选择了"共享标签页音频"或"共享系统音频"选项');
          stream.getTracks().forEach(t => t.stop());
          return;
        }

        stream.getVideoTracks().forEach(t => t.stop());
        const audioStream = new MediaStream(audioTracks);

        mediaRecorder = new MediaRecorder(audioStream, {
          mimeType: 'audio/webm;codecs=opus'
        });

        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = async () => {
          statusText.textContent = '正在转录...';
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await transcribeBlob(audioBlob, 'audio.webm', statusText);
        };

        mediaRecorder.start();
        startTime = Date.now();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusDiv.classList.add('recording');
        statusText.textContent = '正在录制...';

        timerInterval = setInterval(updateTimer, 1000);

        audioTracks[0].onended = () => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRecording();
          }
        };

      } catch (error) {
        console.error('Error:', error);
        statusText.textContent = '错误: ' + error.message;
      }
    });

    stopBtn.addEventListener('click', stopRecording);

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusDiv.classList.remove('recording');
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const seconds = (elapsed % 60).toString().padStart(2, '0');
      timerEl.textContent = `${minutes}:${seconds}`;
    }

    // ===== 文件上传 =====
    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        selectFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        selectFile(fileInput.files[0]);
      }
    });

    function selectFile(file) {
      selectedFile = file;
      fileName.textContent = file.name;
      fileInfo.classList.add('show');
      uploadBtn.disabled = false;
      uploadStatusText.textContent = '准备就绪';
    }

    fileRemove.addEventListener('click', () => {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.classList.remove('show');
      uploadBtn.disabled = true;
      uploadStatusText.textContent = '选择文件后点击转录';
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      uploadBtn.disabled = true;
      uploadStatusText.textContent = '正在转录...';

      await transcribeBlob(selectedFile, selectedFile.name, uploadStatusText);

      uploadBtn.disabled = false;
    });

    // ===== 通用转录函数 =====
    async function transcribeBlob(blob, filename, statusEl) {
      const formData = new FormData();
      formData.append('file', blob, filename);
      formData.append('language', languageSelect.value);

      try {
        const response = await fetch('/transcribe', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          if (transcript.value) {
            transcript.value += '\n' + result.text;
          } else {
            transcript.value = result.text;
          }
          updateButtons();
          statusEl.textContent = '转录完成';
        } else {
          statusEl.textContent = '转录失败: ' + result.error;
        }
      } catch (error) {
        statusEl.textContent = '请求失败: ' + error.message;
      }
    }

    // ===== 通用功能 =====
    function updateButtons() {
      const hasText = transcript.value.trim().length > 0;
      copyBtn.disabled = !hasText;
      saveBtn.disabled = !hasText;
    }

    copyBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(transcript.value);
      copyBtn.textContent = '已复制!';
      setTimeout(() => { copyBtn.textContent = '复制文本'; }, 2000);
    });

    saveBtn.addEventListener('click', () => {
      const blob = new Blob([transcript.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `transcript_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener('click', () => {
      transcript.value = '';
      timerEl.textContent = '00:00';
      statusText.textContent = '准备就绪';
      uploadStatusText.textContent = '选择文件后点击转录';
      updateButtons();
    });

    updateButtons();
  </script>
</body>
</html>
